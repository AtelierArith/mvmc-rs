[package]
name = "mvmc-core"
version = "0.0.0"
description = "VMC parameter optimization engine (port of MVMCOptimizers.jl)"
license = "GPL-3.0-or-later"
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = []
mpi = ["dep:mpi"]

[dependencies]
sfmt19937 = { workspace = true }
pfapack = { workspace = true, features = ["blas-backend"] }
mvmc-expert-parsers = { workspace = true }
tenferro-tensor = { workspace = true }
tenferro-cpu = { workspace = true }
tenferro-einsum = { workspace = true }
tenferro-ad = { workspace = true }
tenferro-linalg = { workspace = true }
tenferro-runtime = { version = "0.8.0", default-features = false }
num-complex = { workspace = true }
ndarray = { workspace = true }
blas = { workspace = true }
lapack = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }
spindle = "=0.2.6"
mpi = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
approx = { workspace = true }
flate2 = "1"
serde_json = "1"
sha2 = "0.10"

[[example]]
name = "mpi_benchmark"
required-features = ["mpi"]

[[example]]
name = "mpi_rng_audit"
required-features = ["mpi"]

[[example]]
name = "mpi_physcal_benchmark"
required-features = ["mpi"]

[[example]]
name = "mpi_affinity_audit"
required-features = ["mpi"]

# Production Pfaffian/inverse and SR kernels use the BLAS/LAPACK backend,
# matching the pure Julia implementation's LinearAlgebra calls. Scalar
# Pfaffian references remain available in the standalone pfapack crate.
