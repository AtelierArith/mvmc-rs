[package]
name = "mvmc-cli"
version = "0.0.0"
description = "Command-line driver for the Julia-mVMC Rust port (port of examples/*.jl)"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mvmc"
path = "src/main.rs"

# ── Examples — port of extern/Julia-mVMC/examples/*.jl ──────────────────────
# Run with: cargo run --example <name>
# Override step count: JULIA_MVMC_EXAMPLE_STEPS=10 cargo run --example <name>

[[example]]
name = "heisenberg_chain_real"
path = "examples/heisenberg_chain_real.rs"

[[example]]
name = "heisenberg_chain_cmp"
path = "examples/heisenberg_chain_cmp.rs"

[[example]]
name = "heisenberg_chain_fsz"
path = "examples/heisenberg_chain_fsz.rs"

[[example]]
name = "hubbard_chain"
path = "examples/hubbard_chain.rs"

[dependencies]
mvmc-core = { workspace = true }
mvmc-expert-parsers = { workspace = true }
tracing = { workspace = true }

[features]
# Forward `blas-backend` to pfapack so the BLAS-2 / LAPACK kernels are
# enabled in the final binary. OpenBLAS is already linked by
# `mvmc-core/build.rs`, so no extra backend crate is required.
default = []
blas-backend = ["mvmc-core/pfapack-blas"]
# NOTE: Phase 5 will add `openblas-src` here. The binary leaf is where
# the concrete BLAS/LAPACK backend symbols get linked into the final
# executable, so library consumers can swap implementations cleanly.
