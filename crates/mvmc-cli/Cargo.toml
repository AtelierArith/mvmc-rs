[package]
name = "mvmc-cli"
version = "0.0.0"
description = "Command-line driver for the Julia-mVMC Rust port (port of examples/*.jl)"
license = "GPL-3.0-or-later"
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mvmc"
path = "src/main.rs"

# ── Examples — port of extern/Julia-mVMC/examples/*.jl ──────────────────────
# Run with: cargo run --example <name>
# Override step count: JULIA_MVMC_EXAMPLE_STEPS=10 cargo run --example <name>

[[example]]
name = "heisenberg_chain_real"
path = "examples/heisenberg_chain_real.rs"

[[example]]
name = "heisenberg_chain_cmp"
path = "examples/heisenberg_chain_cmp.rs"

[[example]]
name = "heisenberg_chain_fsz"
path = "examples/heisenberg_chain_fsz.rs"

[[example]]
name = "hubbard_chain"
path = "examples/hubbard_chain.rs"

[dependencies]
mvmc-core = { workspace = true }
mvmc-expert-parsers = { workspace = true }
tracing = { workspace = true }

[features]
default = []
mpi = ["mvmc-core/mpi"]
