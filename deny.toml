# cargo-deny configuration.
# Run locally: cargo deny check
#
# License posture (also see docs/PORTING_PLAN.md §License):
#   - sfmt19937  : BSD-3-Clause
#   - pfapack    : BSD-3-Clause (root) + MPL-2.0 (per-file headers on utu2.rs)
#   - mvmc-*     : GPL-3.0-or-later (inherits from upstream Julia-mVMC)

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "warn"
ignore = []

[licenses]
# Allowlist matches the union of upstream license obligations.
allow = [
    "GPL-3.0",
    "GPL-3.0-or-later",
    "BSD-3-Clause",
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.92

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
