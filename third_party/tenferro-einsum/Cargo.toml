    "tenferro-ad?/cpu-blas",
    "tenferro-cpu/cpu-blas",
]
cpu-faer = [
    "tenferro-ad?/cpu-faer",
    "tenferro-cpu/cpu-faer",
]
cuda = [
    "tenferro-ad?/cuda",
    "tenferro-internal-ops/cuda",
    "dep:tenferro-gpu",
    "tenferro-gpu/cuda",
]
