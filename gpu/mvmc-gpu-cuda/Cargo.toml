# Standalone, opt-in workspace for the tenferro CUDA backend (issue #420).
#
# Kept outside the root workspace on purpose: enabling tenferro-gpu's `cuda` feature adds
# ~2000 lines (cubecl, cudarc, ...) to the lock file even as an optional dependency, which
# would change Cargo.lock and the dependency audit surface of every default build. This
# workspace has its own Cargo.lock and is built only by explicit developer/optional-gate
# commands (see docs/design/gpu-readiness.md and scripts/run_cuda_gate.sh).
[workspace]

[package]
name = "mvmc-gpu-cuda"
version = "0.0.0"
description = "tenferro CUDA backend provider, device report and optional gate for mvmc-rs"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[dependencies]
mvmc-core = { path = "../../crates/mvmc-core", features = ["gpu-cuda"] }
mvmc-expert-parsers = { path = "../../crates/mvmc-expert-parsers" }
mvmc-gpu = { path = "../../crates/mvmc-gpu" }
mvmc-cli = { path = "../../crates/mvmc-cli", features = ["gpu-cuda"] }
sfmt19937 = { path = "../../crates/sfmt19937" }
# Versions must match the root workspace (crates.io 0.8.0; the git revisions used by
# tenferro-decision-rs have a different with_backend_session signature, tenferro #1971).
tenferro-gpu = { version = "0.8.0", features = ["cuda"] }
# Adapted vendored copy of AtelierArith/tenferro-decision-rs `tenferro-ext`; only its
# single-stream raw CUDA execution helper (`with_raw_exec`/`RawExec`) is compiled
# (issue #547). See gpu/tenferro-ext/README.md.
tenferro-ext = { path = "../tenferro-ext" }
tenferro-ad = { version = "0.8.0", features = ["cuda"] }
tenferro-linalg = { version = "0.8.0", features = ["cuda", "autodiff"] }
tenferro-tensor = { version = "0.8.0", default-features = false }
tenferro-runtime = { version = "0.8.0", default-features = false }
tenferro-internal-ops = { version = "0.8.0", default-features = false }
tenferro-cpu = { version = "0.8.0", default-features = false, features = ["native"] }
num-complex = "0.4"
libloading = "0.8"
# Same version and features as tenferro-gpu's own cudarc (one copy in the lock): pinned host
# memory, streams and events for the transfer helper of issue #432.
cudarc = { version = "0.19", default-features = false, features = ["driver", "nvrtc", "cublas", "cusolver", "curand", "dynamic-loading", "cuda-12080"] }

# Linking tenferro can exhaust hosted-runner disk: keep debuginfo off.
[profile.dev]
debug = 0
strip = "symbols"

[profile.test]
opt-level = 2
debug = 0
