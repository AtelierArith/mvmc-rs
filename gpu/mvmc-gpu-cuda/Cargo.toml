# Standalone, opt-in workspace for the device-resident CUDA GPU Opt/PhysCal (issues #420, #574).
#
# Kept outside the root workspace on purpose: enabling tenferro-gpu's `cuda` feature adds
# ~2000 lines (cubecl, cudarc, ...) to the lock file even as an optional dependency, which
# would change Cargo.lock and the dependency audit surface of every default build. This
# workspace has its own Cargo.lock and is built only by explicit developer/optional-gate
# commands (see docs/design/gpu-readiness.md and scripts/run_cuda_gate.sh).
[workspace]

[package]
name = "mvmc-gpu-cuda"
version = "0.0.0"
description = "Device-resident CUDA GPU Opt and PhysCal runners for mvmc-rs"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[dependencies]
mvmc-core = { path = "../../crates/mvmc-core" }
mvmc-expert-parsers = { path = "../../crates/mvmc-expert-parsers" }
sfmt19937 = { path = "../../crates/sfmt19937" }
# Versions must match the root workspace (crates.io 0.9.0; the git revisions used by
# tenferro-decision-rs have a different with_backend_session signature, tenferro #1971).
tenferro-gpu = { version = "0.9.0", features = ["cuda"] }
# Adapted vendored copy of AtelierArith/tenferro-decision-rs `tenferro-ext`; only its
# single-stream raw CUDA execution helper (`with_raw_exec`/`RawExec`) is compiled
# (issue #547). See gpu/tenferro-ext/README.md.
tenferro-ext = { path = "../tenferro-ext" }
tenferro-tensor = { version = "0.9.0", default-features = false }
num-complex = "0.4"
libloading = "0.8"
# Same version and features as tenferro-gpu's own cudarc (one copy in the lock); the resident
# PhysCal worker uses its driver API to report the active device context.
cudarc = { version = "0.19", default-features = false, features = ["driver", "nvrtc", "cublas", "cusolver", "curand", "dynamic-loading", "cuda-12080"] }

[dev-dependencies]
# CPU batched Pfaffian reference of the resident interval tests.
mvmc-gpu = { path = "../../crates/mvmc-gpu" }

# Linking tenferro can exhaust hosted-runner disk: keep debuginfo off.
[profile.dev]
debug = 0
strip = "symbols"

[profile.test]
opt-level = 2
debug = 0
