# Independent test, lint and documentation jobs share the numerical environment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  tests:
    name: Tests (${{ matrix.platform.name }}, ${{ matrix.configuration.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_CORETYPE: ${{ matrix.platform.blas_core }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux x86_64, os: ubuntu-24.04, arch: X64, blas_core: HASWELL, cache: linux-x86_64 }
          - { name: macOS ARM64, os: macos-15, arch: ARM64, blas_core: NEOVERSEN1, cache: macos-arm64 }
        configuration:
          - { name: Default features — serial, args: '', cache: default }
          - { name: All features — MPI + SIMD, args: --all-features, cache: all-features }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust-ci
        with:
          arch: ${{ matrix.platform.arch }}
          platform: ${{ matrix.platform.cache }}
          cache-key: tests-${{ matrix.configuration.cache }}
          tools: nextest
      - name: Set up uv for bounded infrastructure regression
        if: matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Check real optional gate failure reporting
        if: matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default'
        run: |
          timeout -k 10s 120s uv run --offline --no-project --no-python-downloads \
            --python /usr/bin/python3 python -B scripts/test_optional_gate_failure_pipeline_183.py
          timeout -k 5s 120s uv run --offline --no-project --no-python-downloads \
            --python /usr/bin/python3 python -B scripts/test_optional_fixture_metadata_183.py
          timeout -k 5s 120s uv run --offline --no-project --no-python-downloads \
            --python /usr/bin/python3 python -B scripts/test_optional_gate_aggregation_183.py
      - name: Run unit and integration tests
        env:
          FEATURE_ARGS: ${{ matrix.configuration.args }}
          MVMC_CG_DIAGNOSTICS: '1'
          MVMC_PHYSCAL181_FSZ_DIAGNOSTIC: '1'
          TMPDIR: /tmp
        run: |
          feature_args=()
          if test -n "$FEATURE_ARGS"; then feature_args+=("$FEATURE_ARGS"); fi
          cargo nextest run --workspace "${feature_args[@]}" --locked --cargo-profile ci --no-fail-fast --retries 0
      - name: Upload CG diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cg-diagnostics-${{ matrix.platform.cache }}-${{ matrix.configuration.cache }}
          path: |
            /tmp/mvmc-run-*.cg-diagnostics.txt
            /tmp/mvmc-cg-fixed-*.txt
          if-no-files-found: ignore
      - name: Log target disk usage
        if: always()
        run: |
          du -sh target || true
          df -h .

  lint:
    name: Lint — fmt and Clippy (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_CORETYPE: ${{ matrix.platform.blas_core }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux x86_64, os: ubuntu-24.04, arch: X64, blas_core: HASWELL, cache: linux-x86_64 }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust-ci
        with:
          arch: ${{ matrix.platform.arch }}
          platform: ${{ matrix.platform.cache }}
          cache-key: lint
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Clippy with all features
        run: cargo clippy --workspace --all-targets --all-features --locked --profile ci -- -D warnings

  documentation:
    name: Documentation — doctests and build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_CORETYPE: ${{ matrix.platform.blas_core }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux x86_64, os: ubuntu-24.04, arch: X64, blas_core: HASWELL, cache: linux-x86_64 }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust-ci
        with:
          arch: ${{ matrix.platform.arch }}
          platform: ${{ matrix.platform.cache }}
          cache-key: documentation
      - name: Run documentation tests with all features
        run: cargo test --workspace --all-features --locked --doc --profile ci
      - name: Build API documentation with all features
        run: cargo doc --workspace --all-features --locked --no-deps --profile ci
