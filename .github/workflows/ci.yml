# Independent test, lint and documentation jobs share the numerical environment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  tests:
    name: Tests (${{ matrix.platform.name }}, ${{ matrix.configuration.name }})
    runs-on: ${{ matrix.platform.os }}
    # Default Linux now also retains bounded acquisition after workspace FAIL.
    timeout-minutes: ${{ matrix.platform.cache == 'linux-x86_64' && 90 || 45 }}
    env:
      OPENBLAS_CORETYPE: ${{ matrix.platform.blas_core }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux x86_64, os: ubuntu-24.04, arch: X64, blas_core: HASWELL, cache: linux-x86_64 }
          - { name: macOS ARM64, os: macos-15, arch: ARM64, blas_core: NEOVERSEN1, cache: macos-arm64 }
        configuration:
          - { name: Default features — serial, args: '', cache: default }
          - { name: All features — MPI + SIMD, args: --all-features, cache: all-features }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust-ci
        with:
          arch: ${{ matrix.platform.arch }}
          platform: ${{ matrix.platform.cache }}
          cache-key: tests-${{ matrix.configuration.cache }}
          tools: nextest
      - name: Set up uv for bounded infrastructure regression
        if: matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Check real optional gate failure reporting
        if: matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default'
        run: |
          timeout -k 10s 120s uv run --offline --no-project --no-python-downloads \
            --python /usr/bin/python3 python -B scripts/test_optional_gate_failure_pipeline_183.py
          timeout -k 5s 120s uv run --offline --no-project --no-python-downloads \
            --python /usr/bin/python3 python -B scripts/test_optional_fixture_metadata_183.py
          timeout -k 5s 120s uv run --offline --no-project --no-python-downloads \
            --python /usr/bin/python3 python -B scripts/test_optional_gate_aggregation_183.py
          timeout -k 5s 120s uv run --offline --no-project --no-python-downloads \
            --python /usr/bin/python3 python -B scripts/test_optional_reference_provenance_183.py
      - name: Check issue 179 P02 synthetic schemas
        if: matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default'
        working-directory: scripts/issue179_p02
        run: |
          timeout -k 5s 120s uv run --offline --no-project --no-python-downloads \
            --python /usr/bin/python3 python -B -m unittest -v \
            test_p02_binding test_p02_cross_discrete test_p02_typed_fullpack test_rank_binding
      - name: Match MPI provider for scalar native contracts
        if: matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'all-features'
        env:
          # Hosted VM RDMA can expose verbs devices without working SRQ support.
          # These same-host CPU gates use loopback/shared-memory/TCP, not RDMA.
          UCX_TLS: self,sm,tcp
        run: |
          test "$UCX_TLS" = self,sm,tcp
          sudo apt-get install -y jq libucx-dev gfortran build-essential
          bash scripts/issue234/native/install-pmi1-mpich.sh "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/scalar-mpich" "$RUNNER_TEMP/scalar-mpi-provider"
          bash scripts/issue234/native/validate-local-transport.sh \
            "$RUNNER_TEMP/scalar-mpi-provider/settings.txt"
          printf 'UCX_TLS=%s\n' "$UCX_TLS" >> "$GITHUB_ENV"
      - name: Run unit and integration tests
        env:
          FEATURE_ARGS: ${{ matrix.configuration.args }}
          MVMC_CG_DIAGNOSTICS: '1'
          MVMC_PHYSCAL181_FSZ_DIAGNOSTIC: '1'
          TMPDIR: /tmp
        run: |
          feature_args=()
          if test -n "$FEATURE_ARGS"; then feature_args+=("$FEATURE_ARGS"); fi
          cargo nextest run --workspace "${feature_args[@]}" --locked --cargo-profile ci --no-fail-fast --retries 0
      - name: Acquire independent C59 factor/inverse stage witness (default only)
        if: ${{ !cancelled() && matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default' }}
        timeout-minutes: 55
        run: |
          /bin/bash --noprofile --norc -p scripts/pfapack-factor-acquisition/run-ci.sh \
            "$RUNNER_TEMP/pfapack-factor-acquisition"
      - name: Upload independent factor acquisition including first failure
        if: always() && matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default'
        uses: actions/upload-artifact@v4
        with:
          name: pfapack-factor-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pfapack-factor-acquisition
          if-no-files-found: error
          compression-level: 9
      - name: Check lossless developer transport and passive boundary controls
        if: ${{ !cancelled() && matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue180-transport-controls"
          mkdir "$out"
          finish() {
            prior=$?; trap - EXIT; set +e; post=0
            if test -f "$out/source.before.sha256"; then
              sha256sum -c --quiet "$out/source.before.sha256" > "$out/source.post.log" 2>&1 || post=1
            else post=1; fi
            printf 'prior=%s post=%s\n' "$prior" "$post" > "$out/terminal.txt"
            if test "$prior" != 0; then exit "$prior"; fi
            test "$post" = 0
          }
          trap finish EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'head=%s\n' "$GITHUB_SHA" > "$out/head.txt"
          sha256sum crates/mvmc-core/src/{lib,run,sr_observer,issue180_boundary_dev,issue180_binary_diagnostics}.rs \
            scripts/decode_issue180_f64.rs .github/workflows/ci.yml > "$out/source.before.sha256"
          selection='test(/^issue180_binary_diagnostics::(literal_header_and_boundary_bits_roundtrip|malformed_truncated_oversized_and_wrong_record_rejected|file_creation_is_exclusive_and_preserves_literal_bits)$/) | test(/^run::issue180_boundary_dev::tests::(passive_snapshot_preserves_raw_cursor_count_and_future|scope_panic_cleanup_and_thread_local_isolation|disabled_hook_has_no_records_or_rng_mutation|full_field_order_lengths_and_explicit_boundary_sequence)$/)'
          cargo nextest list --workspace --locked --cargo-profile ci -E "$selection" \
            --message-format json > "$out/list.json"
          cargo metadata --locked --no-deps --format-version 1 > "$out/metadata.json"
          package=$(jq -er --arg manifest "$GITHUB_WORKSPACE/crates/mvmc-core/Cargo.toml" \
            '[.packages[]|select(.name=="mvmc-core" and .manifest_path==$manifest)] | if length==1 then .[0].id else error("core package association") end' "$out/metadata.json")
          jq -e --arg package "$package" --arg cwd "$GITHUB_WORKSPACE/crates/mvmc-core" '
            [."rust-suites"[] as $suite | $suite.testcases|to_entries[] |
              select(.value."filter-match".status=="matches") |
              {name:.key,ignored:.value.ignored,package:$suite."package-id",cwd:$suite.cwd,kind:$suite.kind}]
            | length==7 and all(.[]; .ignored==false and .package==$package and .cwd==$cwd and .kind=="lib")
              and ([.[].name]|unique|length)==7' "$out/list.json" > "$out/inventory.log"
          timeout -k 5s 120s cargo nextest run --workspace --locked --cargo-profile ci \
            -E "$selection" --no-tests fail --no-fail-fast --retries 0 2>&1 | tee "$out/controls.log"
      - name: Acquire issue179 same-input public runner OFF and ON
        if: ${{ !cancelled() && matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default' }}
        shell: bash
        env:
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue179-native-prefix1"
          test ! -e "$out"; mkdir -m700 "$out"
          finish() {
            prior=$?; trap - EXIT; set +e; post=0
            for kind in source selected providers input; do
              status=NOT_STARTED
              if test -s "$out/$kind.before.sha256"; then
                sha256sum -c --quiet "$out/$kind.before.sha256" > "$out/$kind.post.log" 2>&1
                status=$?
              fi
              printf '%s\n' "$status" > "$out/$kind.post.status"
              if test "$status" = NOT_STARTED; then
                test "$post" != 0 || post=NOT_STARTED
              elif test "$status" != 0; then post=1; fi
            done
            if test -f "$out/tree.before.txt"; then
              { git rev-parse HEAD HEAD^{tree}; git status --porcelain=v1 --untracked-files=all --ignore-submodules=none; } > "$out/tree.after.txt"
              cmp "$out/tree.before.txt" "$out/tree.after.txt" > "$out/tree.post.log" 2>&1 || post=1
            fi
            printf 'prior=%s post=%s scope=world1-prefix1-store1-passivity-only\n' "$prior" "$post" > "$out/terminal.txt"
            if test "$prior" != 0; then exit "$prior"; fi
            if test "$post" = 0; then exit 0; else exit 74; fi
          }
          trap finish EXIT
          # Retain actual guard evidence BEFORE rejecting; no cleanliness waiver.
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA" > "$out/expected-head.txt"
          git rev-parse HEAD HEAD^{tree} > "$out/observed-head-tree.txt"
          git rev-parse --show-toplevel > "$out/observed-toplevel.txt"
          git status --porcelain=v1 --untracked-files=all --ignore-submodules=none > "$out/guard-status.txt"
          git diff --submodule=short --name-status > "$out/guard-tracked-diff.txt"
          git diff --cached --submodule=short --name-status > "$out/guard-index-diff.txt"
          git submodule status --recursive > "$out/guard-submodules.txt"
          git submodule foreach --quiet --recursive 'printf "submodule=%s\n" "$displaypath"; git rev-parse HEAD; git status --porcelain=v1 --untracked-files=all --ignore-submodules=none' > "$out/guard-child-status.txt"
          if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
            printf 'HEAD_MISMATCH\n' > "$out/guard-reason.txt"
            exit 1
          fi
          if test -s "$out/guard-status.txt"; then
            printf 'DIRTY_WORKTREE\n' > "$out/guard-reason.txt"
            exit 1
          fi
          printf 'HEAD_AND_CLEAN_GUARDS_PASS\n' > "$out/guard-reason.txt"
          { git rev-parse HEAD HEAD^{tree}; git status --porcelain=v1 --untracked-files=all --ignore-submodules=none; } > "$out/tree.before.txt"
          printf 'head=%s\n' "$GITHUB_SHA" > "$out/head.txt"
          # Record inherited thread overrides; do not replace MVMC_RS_* settings.
          env | LC_ALL=C sort | grep -E '^(MVMC_RS_INNER_THREADS|MVMC_RS_INNER_THRESHOLD|OMP_NUM_THREADS|OPENBLAS_NUM_THREADS|OPENBLAS_CORETYPE|MKL_NUM_THREADS|BLIS_NUM_THREADS)=' > "$out/thread-env.txt"
          git ls-files -z crates/mvmc-core/src crates/pfapack/src crates/sfmt19937/src crates/mvmc-expert-parsers/src ':glob:crates/**/Cargo.toml' ':glob:crates/**/build.rs' Cargo.toml Cargo.lock .cargo .github/workflows/ci.yml crates/mvmc-core/tests/fixtures/issue179_native_prefix1 |
            xargs -0 -r sha256sum > "$out/source.before.sha256"
          fixture=crates/mvmc-core/tests/fixtures/issue179_native_prefix1
          (cd "$fixture" && sha256sum -c --quiet inputs.sha256)
          mkdir -m700 "$out/input"; cp "$fixture/"*.def "$out/input/"
          (cd "$out/input" && sha256sum -c --quiet "$GITHUB_WORKSPACE/$fixture/inputs.sha256")
          sha256sum "$out/input/"*.def > "$out/input.before.sha256"
          cargo metadata --locked --no-deps --format-version 1 > "$out/metadata.json"
          pkg=$(jq -er --arg m "$GITHUB_WORKSPACE/crates/mvmc-core/Cargo.toml" '[.packages[]|select(.name=="mvmc-core" and .manifest_path==$m)]|if length==1 then .[0].id else error("package/source association") end' "$out/metadata.json")
          selection='test(=run::issue179_native_same_input::issue179_native_same_input_public_runner)'
          cargo nextest list -p mvmc-core --lib --locked --cargo-profile ci --run-ignored ignored-only -E "$selection" --message-format json > "$out/list.json"
          jq -e --arg package "$pkg" --arg cwd "$GITHUB_WORKSPACE/crates/mvmc-core" '
            [."rust-suites"[] as $suite | $suite.testcases|to_entries[] |
              select(.value."filter-match".status=="matches") |
              {name:.key,ignored:.value.ignored,package:$suite."package-id",cwd:$suite.cwd,kind:$suite.kind,binary:$suite."binary-path"}]
            | length==1 and all(.[]; .name=="run::issue179_native_same_input::issue179_native_same_input_public_runner" and .ignored==true and .package==$package and .cwd==$cwd and .kind=="lib")' "$out/list.json" > "$out/inventory.log"
          # Same existing ci graph/default features, NOT test-fast. Compile-only JSON
          # supplies exact package_id/src_path/executable identity, not guessed suite keys.
          cargo test --locked --profile ci -p mvmc-core --lib --no-run --message-format=json > "$out/artifacts.jsonl"
          binary=$(jq -ser --arg p "$pkg" --arg s "$GITHUB_WORKSPACE/crates/mvmc-core/src/lib.rs" '[.[]|select(.reason=="compiler-artifact" and .package_id==$p and .target.src_path==$s and .target.kind==["lib"] and .profile.test==true and .executable!=null)]|if length==1 then .[0].executable else error("unique library test artifact") end' "$out/artifacts.jsonl")
          sha256sum "$binary" > "$out/selected.before.sha256"
          jq -e --arg binary "$binary" '[."rust-suites"[] as $suite | $suite.testcases|to_entries[] | select(.value."filter-match".status=="matches") | $suite."binary-path"] == [$binary]' "$out/list.json" > "$out/list-elf.log"
          ldd "$binary" > "$out/ldd.txt"
          awk 'NF==0{next} $1=="linux-vdso.so.1"&&$2~/^\(0x[0-9a-f]+\)$/{next} $2=="=>"&&$3~/^\//{print $3;next} $1~/^\//&&$2~/^\(0x[0-9a-f]+\)$/{print $1;next} {exit 1}' "$out/ldd.txt" |
            LC_ALL=C sort -u | xargs -r sha256sum > "$out/providers.before.sha256"
          cargo nextest run --help > "$out/nextest-help.txt"
          export ISSUE179_INPUT_NAMELIST="$out/input/namelist.def"
          for mode in off on; do
            export ISSUE179_OBSERVER_MODE=$mode ISSUE179_RUST_OUTPUT="$out/$mode"
            # Existing verified PfaPack CI syntax; not a libtest argument before --.
            set +e
            timeout -k5s 120s cargo nextest run --locked --cargo-profile ci -p mvmc-core --lib \
              --run-ignored ignored-only --no-tests fail --no-fail-fast --retries 0 \
              -E 'test(=run::issue179_native_same_input::issue179_native_same_input_public_runner)' \
              > "$out/$mode.stdout" 2> "$out/$mode.stderr"
            status=$?; set -e; printf '%s\n' "$status" > "$out/$mode.exit"
            if test "$status" != 0; then exit "$status"; fi
            sha256sum -c --quiet "$out/selected.before.sha256"
          done
          for name in zqp_opt.dat zvo_SRinfo.dat zvo_out_001.dat zvo_var_001.dat; do
            cmp "$out/off/$name" "$out/on/$name"
          done
          printf '0\n' > "$out/public-passivity.exit"
      - name: Upload lossless transport control receipts
        if: always() && matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'default'
        uses: actions/upload-artifact@v4
        with:
          name: issue180-transport-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/issue180-transport-controls
            ${{ runner.temp }}/issue179-native-prefix1
          if-no-files-found: error
      - name: Launch exact-head scalar contracts on worlds2 and4
        if: matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'all-features'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/scalar-native"
          mkdir "$out"
          finish() {
            prior=$?; trap - EXIT; set +e; post=0
            for manifest in source selected runtime; do
              test ! -f "$out/$manifest.before.sha256" ||
                sha256sum -c --quiet "$out/$manifest.before.sha256" > "$out/$manifest.post.log" 2>&1 || post=1
            done
            sha256sum -c --quiet "$MVMC_ISSUE234_MPI_RECEIPT/provider.sha256" > "$out/provider.post.log" 2>&1 || post=1
            printf 'prior=%s post=%s\n' "$prior" "$post" > "$out/terminal.txt"
            test "$prior" = 0 && test "$post" = 0
          }
          trap finish EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'head=%s\n' "$GITHUB_SHA" > "$out/head.txt"
          sha256sum crates/mvmc-core/src/{lib,mpi,reducer,parallel_scalar}.rs \
            crates/mvmc-core/tests/{issue184_parallel_scalar_contracts,mpi_issue184_parallel_scalar_contracts}.rs \
            .github/workflows/ci.yml scripts/issue234/native/validate-local-transport.sh \
            > "$out/source.before.sha256"
          bash scripts/issue234/native/validate-local-transport.sh \
            "$MVMC_ISSUE234_MPI_RECEIPT/settings.txt"
          printf 'UCX_TLS=%s\n' "$UCX_TLS" > "$out/transport.txt"
          cargo nextest list --workspace --all-features --cargo-profile ci --locked \
            --message-format json > "$out/list.json"
          binary=$(jq -er '[."rust-suites"[]|select(."binary-name"=="mpi_issue184_parallel_scalar_contracts"
            and (.testcases|length)==1
            and .testcases.scalar_domains_use_actual_membership_and_signed_negative_max.ignored==true)]
            |if length==1 then .[0]["binary-path"] else error("native identity missing") end' "$out/list.json")
          sha256sum "$binary" > "$out/selected.before.sha256"
          ldd "$binary" > "$out/ldd.txt"
          ! grep -q 'not found' "$out/ldd.txt"
          awk -v prefix="$MVMC_ISSUE234_MPI_PREFIX/lib/" '$1~/^libmpi[.]so/&&index($3,prefix)==1{n++}END{exit(n!=1)}' "$out/ldd.txt"
          awk '$2=="=>"&&substr($3,1,1)=="/"{print $3}substr($1,1,1)=="/"{print $1}' "$out/ldd.txt" |
            sort -u | xargs -r sha256sum > "$out/runtime.before.sha256"
          for world in 2 4; do
            status=0
            timeout -k 10s 120s "$MVMC_ISSUE234_MPI_PREFIX/bin/mpiexec" -disable-auto-cleanup \
              -outfile-pattern "$out/world$world-rank%r.stdout" -errfile-pattern "$out/world$world-rank%r.stderr" \
              -n "$world" "$binary" --ignored --exact scalar_domains_use_actual_membership_and_signed_negative_max --nocapture ||
              status=$?
            printf '%s\n' "$status" > "$out/world$world.native.status"
            test "$status" = 0
            for ((rank=0;rank<world;rank++)); do
              awk '/^test result: ok[.] 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in [0-9]+[.][0-9]+s$/{n++}
                END{exit(n!=1)}' "$out/world$world-rank$rank.stdout"
            done
          done
      - name: Upload scalar native receipts including first failure
        if: always() && matrix.platform.cache == 'linux-x86_64' && matrix.configuration.cache == 'all-features'
        uses: actions/upload-artifact@v4
        with:
          name: scalar-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scalar-native
            ${{ runner.temp }}/scalar-mpi-provider
          if-no-files-found: error
      - name: Upload CG diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cg-diagnostics-${{ matrix.platform.cache }}-${{ matrix.configuration.cache }}
          path: |
            /tmp/mvmc-run-*.cg-diagnostics.txt
            /tmp/mvmc-cg-fixed-*.txt
          if-no-files-found: ignore
      - name: Log target disk usage
        if: always()
        run: |
          du -sh target || true
          df -h .

  lint:
    name: Lint — fmt and Clippy (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_CORETYPE: ${{ matrix.platform.blas_core }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux x86_64, os: ubuntu-24.04, arch: X64, blas_core: HASWELL, cache: linux-x86_64 }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust-ci
        with:
          arch: ${{ matrix.platform.arch }}
          platform: ${{ matrix.platform.cache }}
          cache-key: lint
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Clippy with all features
        run: cargo clippy --workspace --all-targets --all-features --locked --profile ci -- -D warnings

  documentation:
    name: Documentation — doctests and build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_CORETYPE: ${{ matrix.platform.blas_core }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux x86_64, os: ubuntu-24.04, arch: X64, blas_core: HASWELL, cache: linux-x86_64 }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust-ci
        with:
          arch: ${{ matrix.platform.arch }}
          platform: ${{ matrix.platform.cache }}
          cache-key: documentation
      - name: Run documentation tests with all features
        run: cargo test --workspace --all-features --locked --doc --profile ci
      - name: Build API documentation with all features
        run: cargo doc --workspace --all-features --locked --no-deps --profile ci
