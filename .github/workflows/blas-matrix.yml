# Optional BLAS provider / kernel matrix for the numerical tests (#455).
# The main CI pins OPENBLAS_CORETYPE (HASWELL / NEOVERSEN1) with Homebrew or apt OpenBLAS.
# This workflow runs the same tests with the provider variants developers can hit:
# macOS and Linux OpenBLAS with the kernel chosen by the CPU (hosted macOS VMs report the
# generic `armv8` core), unpinned thread counts, and macOS Accelerate (`MVMC_BLAS_PROVIDER=accelerate`,
# #474). Manual, or when this file changes.
name: BLAS matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/blas-matrix.yml']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: ${{ matrix.variant.name }}
    runs-on: ${{ matrix.variant.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: macOS ARM64 OpenBLAS native kernel (threads 1), os: macos-15, arch: ARM64, cache: macos-arm64, provider: openblas, coretype: '', threads: '1' }
          - { name: macOS ARM64 OpenBLAS native kernel (threads default), os: macos-15, arch: ARM64, cache: macos-arm64, provider: openblas, coretype: '', threads: '' }
          - { name: macOS ARM64 Accelerate (threads default), os: macos-15, arch: ARM64, cache: macos-arm64, provider: accelerate, coretype: '', threads: '' }
          - { name: macOS ARM64 Accelerate strict-bounds probe (informational), os: macos-15, arch: ARM64, cache: macos-arm64, provider: accelerate, coretype: '', threads: '', kclass: reference, probe: true }
          - { name: Linux x86_64 OpenBLAS native kernel (threads 1), os: ubuntu-24.04, arch: X64, cache: linux-x86_64, provider: openblas, coretype: '', threads: '1' }
          - { name: Linux x86_64 OpenBLAS native kernel (threads default), os: ubuntu-24.04, arch: X64, cache: linux-x86_64, provider: openblas, coretype: '', threads: '' }
    env:
      MVMC_BLAS_PROVIDER: ${{ matrix.variant.provider }}
      MVMC_BLAS_KERNEL_CLASS: ${{ matrix.variant.kclass }}
      MVMC_CG_DIAGNOSTICS: '1'
      MVMC_PHYSCAL181_FSZ_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust-ci
        with:
          arch: ${{ matrix.variant.arch }}
          platform: ${{ matrix.variant.cache }}
          cache-key: blas-matrix
          tools: nextest
      - name: Select BLAS threads and kernel
        run: |
          # Unset variables, not empty strings: OpenBLAS treats an empty
          # OPENBLAS_CORETYPE as an unknown core name.
          if test -n "${{ matrix.variant.threads }}"; then
            echo "OPENBLAS_NUM_THREADS=${{ matrix.variant.threads }}" >> "$GITHUB_ENV"
            echo "OMP_NUM_THREADS=${{ matrix.variant.threads }}" >> "$GITHUB_ENV"
          fi
          if test -n "${{ matrix.variant.coretype }}"; then
            echo "OPENBLAS_CORETYPE=${{ matrix.variant.coretype }}" >> "$GITHUB_ENV"
          fi
      - name: Record provider
        run: |
          uname -a
          if test "$RUNNER_OS" = Linux; then lscpu | grep -E 'Model name|Flags' | cut -c1-300; dpkg -l | grep -E 'openblas|liblapack' || true; else sysctl -n machdep.cpu.brand_string; brew list --versions openblas || echo "no Homebrew openblas (Accelerate)"; fi
      - name: Record the OpenBLAS kernel in use
        run: OPENBLAS_VERBOSE=2 cargo nextest list -p mvmc-core --test sr_cg --cargo-profile ci --locked 2>&1 | grep -E "^Core" | head -1 || true
      - name: Run tests
        # The strict-bounds probe forces the reference-kernel bounds on a provider that does not
        # have them, to record how far it is from them; its failures are findings, not CI failures
        # (the step is marked failed, the job stays green).
        continue-on-error: ${{ matrix.variant.probe == true }}
        run: cargo nextest run --workspace --locked --cargo-profile ci --no-fail-fast --retries 0
      - name: Record the linked BLAS/LAPACK libraries
        if: always()
        run: |
          bin=$(ls target/ci/deps/sr_cg-* | grep -v '\.d$' | head -1)
          if test "$RUNNER_OS" = macOS; then otool -L "$bin" | grep -Ei 'accelerate|blas|lapack'; else ldd "$bin" | grep -Ei 'blas|lapack'; fi
