name: Explicit bounded optional gates

"on":
  workflow_dispatch:
    inputs:
      family:
        description: Bounded scope (not full model/Julia coverage)
        required: true
        default: general
        type: choice
        options: [general, lanczos, mpi, thread, all]

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  OPENBLAS_CORETYPE: HASWELL
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Validate explicit dispatch scope (no numerical execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - id: scope
        env:
          SCOPE: ${{ inputs.family }}
          PLAN: ${{ runner.temp }}/optional-plan.json
          EXPECTED_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_ID: ${{ github.workflow_ref }}
        run: |
          uv run --no-project python scripts/aggregate_optional_gates_183.py plan \
            --scope "$SCOPE" --head "$EXPECTED_HEAD" --run-id "$RUN_ID" \
            --attempt "$ATTEMPT" --workflow "$WORKFLOW_ID" --output "$PLAN"
      - uses: actions/upload-artifact@v4
        with:
          name: optional-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/optional-plan.json
          if-no-files-found: error
  bounded:
    needs: plan
    name: Explicit ${{ matrix.family }} (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      FAMILY: ${{ matrix.family }}
      EXPECTED_HEAD: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      ATTEMPT: ${{ github.run_attempt }}
      WORKFLOW_ID: ${{ github.workflow_ref }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Initialize exclusive evidence paths
        run: |
          printf 'EVIDENCE=%s/optional-%s-%s-%s\n' "$RUNNER_TEMP" "$FAMILY" "$RUN_ID" "$ATTEMPT" >> "$GITHUB_ENV"
          printf 'PACKAGE=%s/optional-package-%s-%s-%s\n' "$RUNNER_TEMP" "$FAMILY" "$RUN_ID" "$ATTEMPT" >> "$GITHUB_ENV"
          printf 'PLAN=%s/dispatch-plan/optional-plan.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: optional-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-plan
      - uses: ./.github/actions/setup-rust-ci
        with:
          arch: X64
          platform: linux-x86_64
          cache-key: optional-${{ matrix.family }}
          tools: nextest
      - uses: astral-sh/setup-uv@v6
      - name: Match MPI PMI1 and Hydra before compiling the MPI family
        if: matrix.family == 'mpi'
        run: |
          sudo apt-get install -y libucx-dev gfortran build-essential
          bash scripts/issue234/native/install-pmi1-mpich.sh "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/optional-mpich-$RUN_ID-$ATTEMPT" \
            "$RUNNER_TEMP/optional-mpi-provider-$RUN_ID-$ATTEMPT"
      - name: Infrastructure tests (not model execution)
        run: |
          uv run --no-project python scripts/test_optional_gates_183.py
          uv run --no-project python scripts/test_optional_gate_aggregation_183.py
          uv run --no-project python scripts/test_optional_gate_failure_pipeline_183.py
          uv run --no-project python scripts/test_optional_fixture_metadata_183.py
          uv run --no-project python scripts/test_optional_reference_provenance_183.py
      - name: Execute ONLY requested bounded gates
        env:
          CARGO_TERM_COLOR: never
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/optional-${{ matrix.family }}
        run: uv run --no-project python scripts/run_optional_gates_183.py "$FAMILY" "$EVIDENCE"
      - name: Seal job context even on failure (not a numerical PASS)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          uv run --no-project python scripts/aggregate_optional_gates_183.py seal \
            --plan "$PLAN" --family "$FAMILY" --head "$EXPECTED_HEAD" \
            --run-id "$RUN_ID" --attempt "$ATTEMPT" --workflow "$WORKFLOW_ID" \
            --evidence "$EVIDENCE" --job-status "$JOB_STATUS" --output "$PACKAGE" \
            --mpi-provider-receipt "$RUNNER_TEMP/optional-mpi-provider-$RUN_ID-$ATTEMPT"
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-family-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/optional-package-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

  aggregate:
    name: Validate bounded evidence ledger (not full coverage)
    needs: [plan, bounded]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      ATTEMPT: ${{ github.run_attempt }}
      WORKFLOW_ID: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Download this attempt's plan
        id: download-plan
        uses: actions/download-artifact@v4
        with:
          name: optional-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate-plan
      - name: Download only this run/attempt's family packages
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: optional-family-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate-packages
          merge-multiple: false
      - name: Fail closed on absent/failed/inconsistent evidence
        if: always()
        env:
          PLAN: ${{ runner.temp }}/aggregate-plan/optional-plan.json
          PACKAGES: ${{ runner.temp }}/aggregate-packages
          RESULT: ${{ runner.temp }}/optional-aggregate.json
        run: |
          uv run --no-project python scripts/aggregate_optional_gates_183.py aggregate \
            --plan "$PLAN" --head "$EXPECTED_HEAD" --run-id "$RUN_ID" \
            --attempt "$ATTEMPT" --workflow "$WORKFLOW_ID" \
            --packages "$PACKAGES" --output "$RESULT"
      - name: Retain aggregation failures too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/optional-aggregate.json
          if-no-files-found: error
