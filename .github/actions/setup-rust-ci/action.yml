name: Set up Rust numerical CI
description: Verify architecture, install numerical dependencies, and restore the Cargo registry and compiler caches.
inputs:
  arch:
    description: Expected GitHub runner architecture.
    required: true
  platform:
    description: Platform identifier for the shared Cargo cache.
    required: true
  cache-key:
    description: Check configuration that keeps the parallel registry and kache cache writes separate.
    required: true
  tools:
    description: Optional tools to install with taiki-e/install-action.
    default: ''
runs:
  using: composite
  steps:
    - name: Verify runner architecture
      env:
        EXPECTED_ARCH: ${{ inputs.arch }}
      shell: bash
      run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
    - name: Install Linux numerical libraries and MPI
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev liblapack-dev libclang-dev libmpich-dev mpich pkg-config
    - name: Install macOS numerical libraries and MPI
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install openblas mpich
        echo "PKG_CONFIG_PATH=$(brew --prefix openblas)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    # Only the cargo registry/git/bin homes are cached here. Compilation
    # artifacts belong to the content-addressed kache store below, so
    # `cache-targets` stays off to avoid persisting `target/` twice.
    # rust-cache ignores its `key` input whenever `shared-key` is set, so the
    # configuration discriminator must live in `shared-key` to keep the
    # parallel jobs' cache writes separate.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: registry-${{ inputs.platform }}-${{ inputs.cache-key }}
        cache-targets: false
        cache-on-failure: true
    # kache caches per-crate compilation (including workspace crates) by
    # content hash and restores hits by clone/hardlink, and its post step saves
    # even when the job fails. `cache-key-prefix` gives every configuration its
    # own GitHub cache entry instead of racing on one shared key.
    - name: Configure kache content-addressed compiler cache
      uses: kunobi-ninja/kache-action@v1
      with:
        github-cache: 'true'
        cache-key-prefix: kache-${{ inputs.platform }}-${{ inputs.cache-key }}
        # GitHub Actions cache is capped at 10 GB per repository. Keep each
        # configuration's store bounded and only repopulate caches from main, so
        # pull-request and branch jobs restore without consuming the budget.
        max-size: '2GiB'
        save-cache: ${{ github.ref == 'refs/heads/main' }}
        pr-comment: 'false'
    - uses: taiki-e/install-action@v2
      if: inputs.tools != ''
      with:
        tool: ${{ inputs.tools }}
    - name: Record tool and backend versions
      shell: bash
      run: |
        uname -a
        rustc -Vv
        if command -v cargo-nextest >/dev/null; then cargo nextest --version; fi
        pkg-config --modversion openblas
        echo "Requested OpenBLAS core: $OPENBLAS_CORETYPE"
        mpicc -show
