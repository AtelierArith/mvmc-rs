# Workspace manifest for the Julia-mVMC → Rust port.
# Lifecycle / scope assumptions are documented in `docs/PORTING_PLAN.md`.

[workspace]
resolver = "2"
members = [
    "crates/sfmt19937",
    "crates/pfapack",
    "crates/mvmc-expert-parsers",
    "crates/mvmc-core",
    "crates/mvmc-uhf",
    "crates/mvmc-cli",
    "xtask",
]
exclude = [
    "third_party/tenferro-ad",
    "third_party/tenferro-cpu",
    "third_party/tenferro-einsum",
    "third_party/tenferro-runtime",
]

# Temporary security patches for #192; see docs/security/dependabot-alert-5.md.
[patch.crates-io]
tenferro-ad = { path = "third_party/tenferro-ad" }
tenferro-cpu = { path = "third_party/tenferro-cpu" }
tenferro-einsum = { path = "third_party/tenferro-einsum" }
tenferro-runtime = { path = "third_party/tenferro-runtime" }

[workspace.package]
edition = "2021"
# No MSRV floor: toolchain selection is delegated entirely to
# `rust-toolchain.toml`, which always tracks the latest `stable`.
authors = ["ManyVariableVariationalMonteCarlo.jl contributors"]
repository = "https://github.com/atelierarith/ManyVariableVariationalMonteCarlo.jl"
homepage = "https://github.com/atelierarith/ManyVariableVariationalMonteCarlo.jl"

[workspace.dependencies]
# --- internal crates (path-resolved) ---
sfmt19937 = { path = "crates/sfmt19937", version = "0.0.0" }
pfapack = { path = "crates/pfapack", version = "0.0.0" }
mvmc-expert-parsers = { path = "crates/mvmc-expert-parsers", version = "0.0.0" }
mvmc-core = { path = "crates/mvmc-core", version = "0.0.0" }
mvmc-uhf = { path = "crates/mvmc-uhf", version = "0.0.0" }

# --- numerics / data ---
num-complex = "0.4"
ndarray = "0.16"
rand_core = "0.6"
pulp = { version = "0.22.2", default-features = false, features = ["std"] }
tenferro-tensor = { version = "0.7.1", default-features = false }
tenferro-cpu = { version = "0.7.1", default-features = false, features = ["cpu-faer"] }
tenferro-einsum = { version = "0.7.1", default-features = false, features = ["cpu-faer"] }

# --- BLAS / LAPACK plumbing.
#
# Library crates depend on the API wrapper crates (`blas`, `lapack`) only;
# the concrete backend implementation (`openblas-src`, `mkl-src`,
# `accelerate-src`, ...) is selected at the binary leaf in Phase 2 once
# we actually link against BLAS / LAPACK symbols. In Phase 0 the skeleton
# doesn't call into BLAS yet, so no backend crate is wired up.
lapack = "0.19"
blas = "0.22"

# --- ergonomics ---
thiserror = "1"
tracing = "0.1"
rayon = "1.10"
mpi = "0.8"

# --- dev / test ---
approx = "0.5"
proptest = "1"

# Keep normal edits cheap and avoid large debug/symbol artifacts.
[profile.dev]
debug = 0
strip = "symbols"

[profile.test]
opt-level = 0
debug-assertions = true
overflow-checks = true
incremental = true

# Optimize long numerical regressions without release LTO or losing checks.
[profile.test-fast]
inherits = "test"
opt-level = 2
lto = "off"

# Hosted CI follows tenferro-rs: omit debug/symbol artifacts and incremental
# state. Keep optimized numerical kernels and the test overflow/debug checks.
[profile.ci]
inherits = "test-fast"
debug = 0
incremental = false
strip = "symbols"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
