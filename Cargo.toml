[workspace]
members = [
    "crates/mvmc-math",
    "crates/mvmc-core",
    "crates/mvmc-physics",
    "crates/mvmc-io",
    "crates/mvmc-parallel",
    "crates/mvmc-cli",
    "crates/mvmc-bindings",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0"
authors = ["mVMC Contributors"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Numerical computing
ndarray = { version = "0.16" }
num-complex = "0.4"
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"

# Parallel computing
rayon = "1.10"

# Testing (can be used as both dependencies and dev-dependencies)
approx = "0.5"
proptest = "1.5"
criterion = "0.5"

